<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWU PROXY</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #fff0f5; 
            color: #4a4a4a;
            position: relative;
            min-height: 100vh;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            text-align: center; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4); 
            border: 2px solid #ffb6c1;
        }
        h2 {
            color: #ff69b4; 
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .subtitle {
            font-size: 14px;
            color: #ffb6c1;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] { 
            width: 60%; 
            padding: 12px 20px; 
            font-size: 16px; 
            border: 2px solid #ffb6c1; 
            border-radius: 25px; 
            outline: none;
        }
        button { 
            padding: 12px 30px; 
            font-size: 16px; 
            cursor: pointer; 
            background: #ff69b4; 
            color: white; 
            border: none; 
            border-radius: 25px;
            font-weight: bold;
        }
        iframe { 
            width: 100%; 
            height: 600px; 
            border: 2px solid #ffb6c1; 
            border-radius: 15px; 
            background: white; 
        }
        .mascot-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: auto;
            z-index: 10;
        }
        .mascot-right {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: auto;
            z-index: 10;
        }
        .mascot-header {
            width: 65px;
            height: auto;
            vertical-align: middle;
            margin-left: 8px;
        }
        .mascot-footer {
            width: 100px;
            height: auto;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- This pulls images directly from your public folder -->
    <img src="/public/images1.jpeg" class="mascot-left" alt="Mascot 1" onerror="this.src='/images1.jpeg'">
    <img src="/public/images2.jpeg" class="mascot-right" alt="Mascot 2" onerror="this.src='/images2.jpeg'">

    <div class="container">
        <h2>UWU PROXY <img src="/public/images3.jpeg" class="mascot-header" alt="Mascot 3" onerror="this.src='/images3.jpeg'"></h2>
        <div class="subtitle">✨ (you like bypassing network security, don't you) ✨</div>
        
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="https://example.com">
            <button onclick="loadPage()">Go! (っ•‿•)っ</button>
        </div>
        
        <iframe id="proxyFrame"></iframe>

        <br>
        <img src="/public/images4.jpeg" class="mascot-footer" alt="Mascot 4" onerror="this.src='/images4.jpeg'">
    </div>

    <script>
        // Using a fast, free public proxy engine that Vercel cannot block
        const PROXY_BACKEND = "https://allorigins.win";

        function loadPage() {
            let targetUrl = document.getElementById('urlInput').value.trim();
            if (!targetUrl) return alert('Please enter a URL, silly! nya~');
            
            if (!targetUrl.startsWith('http://') && !targetUrl.startsWith('https://')) {
                targetUrl = 'https://' + targetUrl;
            }
            
            // Clean out the old iframe data
            const iframe = document.getElementById('proxyFrame');
            iframe.src = "about:blank";

            // Fetch the website content and inject it directly into the iframe
            fetch(PROXY_BACKEND + encodeURIComponent(targetUrl))
                .then(response => {
                    if (response.ok) return response.json();
                    throw new Error('Network response was not ok.');
                })
                .then(data => {
                    const doc = iframe.contentWindow.document || iframe.contentDocument;
                    doc.open();
                    doc.write(data.contents);
                    doc.close();
                })
                .catch(err => {
                    alert('Error loading page. Try another site, some websites block proxies!');
                    console.error(err);
                });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UWU PROXY</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #fff0f5; /* Cute pastel pink background */
            color: #4a4a4a;
            position: relative;
            min-height: 100vh;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            text-align: center; 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4); 
            border: 2px solid #ffb6c1;
        }
        h2 {
            color: #ff69b4; 
            font-size: 32px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .subtitle {
            font-size: 14px;
            color: #ffb6c1;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .search-box {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="text"] { 
            width: 60%; 
            padding: 12px 20px; 
            font-size: 16px; 
            border: 2px solid #ffb6c1; 
            border-radius: 25px; 
            outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 8px rgba(255, 105, 180, 0.3);
        }
        button { 
            padding: 12px 30px; 
            font-size: 16px; 
            cursor: pointer; 
            background: #ff69b4; 
            color: white; 
            border: none; 
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255, 105, 180, 0.3);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        button:hover {
            background: #ff479d;
            transform: scale(1.05);
        }
        iframe { 
            width: 100%; 
            height: 600px; 
            border: 2px solid #ffb6c1; 
            border-radius: 15px; 
            background: white; 
        }
        
        /* Layout placement configurations for all 4 images */
        .mascot-left {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: auto;
            z-index: 10;
            pointer-events: none;
        }
        .mascot-right {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 120px;
            height: auto;
            z-index: 10;
            pointer-events: none;
        }
        .mascot-header {
            width: 65px;
            height: auto;
            vertical-align: middle;
            margin-left: 8px;
        }
        .mascot-footer {
            width: 100px;
            height: auto;
            margin-top: 15px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Floating in the bottom left corner -->
    <img src="images(1).jpeg" class="mascot-left" alt="Mascot 1">
    
    <!-- Floating in the bottom right corner -->
    <img src="images(2).jpeg" class="mascot-right" alt="Mascot 2">

    <div class="container">
        <!-- Inside the top Title line -->
        <h2>UWU PROXY <img src="images(3).jpeg" class="mascot-header" alt="Mascot 3"></h2>
        <div class="subtitle">✨ (you like bypassing network security, don't you) ✨</div>
        
        <div class="search-box">
            <input type="text" id="urlInput" placeholder="https://example.com">
            <button onclick="loadPage()">Go! (っ•‿•)っ</button>
        </div>
        
        <iframe id="proxyFrame"></iframe>

        <!-- Sits down below your proxy layout window frame -->
        <br>
        <img src="images(4).jpeg" class="mascot-footer" alt="Mascot 4">
    </div>

    <script>
        const PROXY_BACKEND = window.location.origin + "/api/server?url=";

        function loadPage() {
            const targetUrl = document.getElementById('urlInput').value;
            if (!targetUrl) return alert('Please enter a URL, silly! nya~');
            
            document.getElementById('proxyFrame').src = PROXY_BACKEND + encodeURIComponent(targetUrl);
        }
    </script>
</body>
</html>
